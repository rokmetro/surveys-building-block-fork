get:
  tags:
    - Client
  summary: Retrieves users's leaderboard scores
  description: |
    Retrieves scores for every leaderboard the user is in.
  security:
    - bearerAuth: []
  responses:
    200:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas/scores/Score.yaml"
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error