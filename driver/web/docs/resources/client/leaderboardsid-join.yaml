post:
  tags:
    - Client
  summary: Joins leaderboard with specified id
  description: |
    Joins leaderboard with specified id. Creates a new LeaderboardEntry object with admin set to false.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      description: ID of the custom leaderboard
      required: true
      style: simple
      explode: false
      schema:
        type: string
  responses:
    200:
      description: Success
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error