get:
  tags:
    - Client
  summary: Gets the custom leaderboard with the specified id
  description: |
    Returns the custom leaderboard with the specified id
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      description: ID of the custom leaderboard
      required: true
      style: simple
      explode: false
      schema:
        type: string
  responses:
    200:
      description: Success
      content:
        application/json:
          schema:
            $ref: "../../schemas/leaderboards/Leaderboard.yaml"
    400:
      description: Bad request
    401:
      description: Unauthorized
    403:
      description: Forbidden
    500:
      description: Internal error

put:
  tags:
    - Client
  summary: Updates the name of the custom leaderboard with the specified id
  description: |
    Checks if the calling user is an admin and updates the name of the custom leaderboard with the specified id
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      description: ID of the custom leaderboard
      required: true
      style: simple
      explode: false
      schema:
        type: string
  requestBody:
    description: Custom leaderboard update request
    content:
      application/json:
        schema:
          $ref: "../../schemas/leaderboards/Leaderboard.yaml"
    required: true
  responses:
    200:
      description: Success
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error


delete:
  tags:
    - Client
  summary: Deletes the custom leaderboard with the specified id
  description: |
    Checks if the calling user is an admin and deletes the custom leaderboard with the specified id
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      description: ID of the custom leaderboard
      required: true
      style: simple
      explode: false
      schema:
        type: string
  responses:
    200:
      description: Success
    400:
      description: Bad request
    401:
      description: Unauthorized
    403:
      description: Forbidden
    500:
      description: Internal error
