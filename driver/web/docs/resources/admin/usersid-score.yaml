get:
  tags:
    - Admin
  summary: Retrieves a user score by id and calculates the expected score
  description: |
    Retrieves a user score by id and calculates the expected score
    
     **Auth:** Requires admin token with `get_scores`, `all_scores` permission
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      description: id
      required: true
      style: simple
      explode: false
      schema:
        type: string
  responses:
    200:
      description: Success
      content:
        application/json:
          schema:
            $ref: "../../schemas/apis/admin/get-user-score/Response.yaml"
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error