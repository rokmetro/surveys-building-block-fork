get:
  tags:
    - Client
  summary: Retrieves scores with pivot
  description: |
    Gets scores that have the closest value to the pivot and excludes pivot score.
  security:
    - bearerAuth: []
  parameters:
    - name: aboveLimit
      in: query
      description: The number of results to be loaded greater than pivot.
      required: false
      style: simple
      explode: false
      schema:
        type: number
    - name: equalLimit
      in: query
      description: The number of results to be loaded equal to pivot. Excludes pivot.
      required: false
      style: simple
      explode: false
      schema:
        type: number
    - name: belowLimit
      in: query
      description: The number of results to be loaded less than pivot.
      required: false
      style: simple
      explode: false
      schema:
        type: number
  responses:
    200:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas/scores/Score.yaml"
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error