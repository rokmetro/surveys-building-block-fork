post:
  tags:
    - Admin
  summary: Initialize scores for all leaderboard entries
  description: |
    Calculates and updates score values for all leaderboard entries in the specified organization and application.
    
    **Auth:** Requires admin token with appropriate permissions
  security:
    - bearerAuth: []
  responses:
    200:
      description: Success - Scores have been successfully initialized/updated
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Success"
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error - Failed to initialize scores
