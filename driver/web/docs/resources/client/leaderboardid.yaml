put:
  tags:
    - Client
  summary: Updates the name of the custom leaderboard with the specified id
  description: |
    Updates the name of the custom leaderboard with the specified id
  security:
    - bearerAuth: []
  parameters:
    - name: leaderboard_id
      in: path
      description: ID of the custom leaderboard
      required: true
      style: simple
      explode: false
      schema:
        type: string
  requestBody:
    description: Custom leaderboard update request
    content:
      application/json:
        schema:
          $ref: "../../schemas/scores/Leaderboard.yaml"
    required: true
  responses:
    200:
      description: Success
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error


delete:
  tags:
    - Client
  summary: Deletes the custom leaderboard with the specified id
  description: |
    Deletes the custom leaderboard with the specified id
  security:
    - bearerAuth: []
  parameters:
    - name: leaderboard_id
      in: path
      description: ID of the custom leaderboard
      required: true
      style: simple
      explode: false
      schema:
        type: string
  responses:
    200:
      description: Success
    400:
      description: Bad request
    401:
      description: Unauthorized
    403:
      description: Forbidden
    500:
      description: Internal error
