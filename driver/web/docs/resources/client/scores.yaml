get:
  tags:
    - Client
  summary: Retrieves scores
  description: |
    Retrieves scores sorted descending. If a leaderboard ID is provided, only returns scores for users in that leaderboard. If no leaderboard ID is provided, returns all scores.
  security:
    - bearerAuth: []
  parameters:
    - name: leaderboard_id
      in: query
      description: Optional ID of the custom leaderboard to filter scores by. If provided, only returns scores for users who are members of this leaderboard.
      required: false
      style: simple
      explode: false
      schema:
        type: string
    - name: limit
      in: query
      description: The number of results to be loaded in one page
      required: false
      style: simple
      explode: false
      schema:
        type: number
    - name: offset
      in: query
      description: The number of results previously loaded
      required: false
      style: simple
      explode: false
      schema:
        type: number
  responses:
    200:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas/scores/Score.yaml"
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error