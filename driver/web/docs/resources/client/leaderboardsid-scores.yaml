get:
  tags:
    - Client
  summary: Retrieves scores for specified leaderboard
  description: |
    Retrieves paginated scores sorted descending for a specified leaderboard.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      description: The ID of the leaderboard to retrieve scores for
      required: true
      style: simple
      explode: false
      schema:
        type: string
    - name: limit
      in: query
      description: The number of results to be loaded in one page
      required: false
      style: simple
      explode: false
      schema:
        type: number
    - name: offset
      in: query
      description: The number of results previously loaded
      required: false
      style: simple
      explode: false
      schema:
        type: number
  responses:
    200:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas/scores/Score.yaml"
    400:
      description: Bad request
    401:
      description: Unauthorized
    500:
      description: Internal error